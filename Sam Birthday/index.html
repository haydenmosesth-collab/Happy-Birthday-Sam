<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Happy Birthday Sam ehhh - My Dear Thangachi </title>
<style>
  :root { --bg1:#ff9a9e; --bg2:#fad0c4; --ink:#3b2a3f; --card:#ffffffd9; --accent:#e94f77; }
  * { box-sizing: border-box; margin: 0; }
  html { scroll-behavior: smooth; }
  body { font-family: "Segoe UI", system-ui, sans-serif; color: var(--ink); overflow-x: hidden;
         background: linear-gradient(160deg, var(--bg1), var(--bg2)); min-height: 100vh; }
  body.opening { overflow: hidden; }
  section { padding: 72px 20px; max-width: 1080px; margin: auto; text-align: center; }
  h1 { font-size: clamp(2.4rem, 8vw, 4.8rem); color: #fff; text-shadow: 0 4px 18px #0003; }
  h2 { margin-bottom: 24px; font-size: clamp(1.6rem, 5vw, 2.2rem); }
  .sub { font-size: 1.2rem; margin: 12px 0 28px; }
  button { background: var(--accent); color: #fff; border: 0; padding: 14px 28px; font-size: 1.05rem;
           border-radius: 40px; cursor: pointer; box-shadow: 0 8px 20px #0003;
           transition: transform .2s, box-shadow .2s; }
  button:hover { transform: translateY(-3px) scale(1.03); box-shadow: 0 12px 26px #0003; }
  button:focus-visible { outline: 3px solid #fff; outline-offset: 4px; }
  #hero { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .hero-photo { width: 190px; height: 190px; border-radius: 50%; object-fit: cover;
                border: 7px solid #fff; box-shadow: 0 14px 32px #0004; margin-bottom: 22px;
                animation: floatPhoto 4s ease-in-out infinite; }
  @keyframes floatPhoto { 50% { transform: translateY(-8px); } }
  .message { background: var(--card); border: 1px solid #ffffffa8; backdrop-filter: blur(12px);
             border-radius: 24px; padding: 32px; line-height: 1.7; font-size: 1.1rem;
             box-shadow: 0 14px 34px #0002; white-space: pre-line; }
  .gallery { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px; }
  .gallery figure { background: #fff; padding: 12px 12px 16px; border-radius: 14px; box-shadow: 0 10px 24px #0002;
                    transition: transform .35s, box-shadow .35s; }
  .gallery figure:nth-child(odd) { transform: rotate(-2deg); }
  .gallery figure:nth-child(even) { transform: rotate(2deg); }
  .gallery figure:hover { transform: scale(1.04) rotate(0); box-shadow: 0 16px 30px #0003; }
  .gallery img { width: 100%; height: 240px; object-fit: cover; border-radius: 9px; display: block;
                 background: linear-gradient(135deg, #fbc2eb, #a6c1ee); }
  .gallery figcaption { margin-top: 10px; font-size: .95rem; }
  .wishes { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 18px; }
  .wish { background: var(--card); border: 1px solid #ffffffaa; border-radius: 20px; padding: 24px;
          box-shadow: 0 10px 24px #0002; line-height: 1.6; }
  .wish b { display: block; margin-top: 12px; color: var(--accent); }
  #surprise { display: none; }
  footer { padding: 36px 20px; text-align: center; color: #fff; background: #0001; }
  canvas { position: fixed; inset: 0; pointer-events: none; z-index: 30; }

  /* Opening envelope */
  .envelope-screen { position: fixed; inset: 0; z-index: 100; display: grid; place-items: center;
                     background: radial-gradient(circle at top, #fff3, transparent 35%), linear-gradient(135deg, var(--bg1), var(--bg2));
                     transition: opacity .8s, visibility .8s; }
  .envelope-screen.opened { opacity: 0; visibility: hidden; pointer-events: none; }
  .envelope-wrap { text-align: center; perspective: 900px; }
  .envelope { position: relative; width: min(310px, 78vw); height: 210px; margin: 20px auto 30px;
              background: #fff1e8; border-radius: 8px; box-shadow: 0 22px 50px #0003; cursor: pointer; }
  .envelope:before { content: ""; position: absolute; z-index: 4; inset: 0; clip-path: polygon(0 100%, 50% 48%, 100% 100%);
                     background: #ffdce2; border-radius: 8px; }
  .envelope:after { content: "♡"; position: absolute; z-index: 6; left: 50%; bottom: 58px; transform: translateX(-50%);
                    width: 52px; height: 52px; display: grid; place-items: center; border-radius: 50%;
                    background: var(--accent); color: #fff; font-size: 34px; box-shadow: 0 6px 16px #0003;
                    transition: transform .6s, opacity .4s; }
  .envelope.open:after { transform: translateX(-50%) scale(0); opacity: 0; }
  .flap { position: absolute; z-index: 5; inset: 0; clip-path: polygon(0 0, 50% 70%, 100% 0);
          background: #ffc4d1; transform-origin: top; transition: transform .8s ease, z-index .2s .4s; }
  .envelope.open .flap { transform: rotateX(180deg); z-index: 1; }
  .letter-preview { position: absolute; z-index: 3; left: 12%; bottom: 10px; width: 76%; height: 145px;
                    background: #fff; border-radius: 8px; display: grid; place-items: center;
                    font-weight: 700; color: var(--accent); transition: transform .8s .35s; }
  .envelope.open .letter-preview { transform: translateY(-85px); }
  .open-envelope-text { color: #fff; text-shadow: 0 2px 10px #0003; margin-bottom: 8px; }

  /* Virtual cake */
  .cake-section { max-width: 760px; }
  .cake { position: relative; width: 260px; height: 190px; margin: 20px auto 18px; filter: drop-shadow(0 16px 18px #0002); }
  .cake-top { position: absolute; z-index: 3; width: 260px; height: 58px; top: 52px; border-radius: 50%;
              background: #fff4ed; border: 8px solid #f08caa; }
  .cake-body { position: absolute; z-index: 2; width: 260px; height: 120px; bottom: 0;
               border-radius: 20px 20px 42px 42px; background: repeating-linear-gradient(90deg, #ef9bb6 0 32px, #ffd8e3 32px 64px); }
  .candles { position: absolute; z-index: 5; top: 10px; width: 260px; display: flex; justify-content: space-around; padding: 0 26px; }
  .candle { position: relative; width: 14px; height: 58px; border-radius: 5px 5px 2px 2px;
            background: repeating-linear-gradient(45deg, #fff 0 6px, #87bde6 6px 12px); }
  .flame { position: absolute; left: 50%; top: -24px; width: 16px; height: 24px; transform: translateX(-50%);
           border-radius: 50% 50% 50% 50%; background: #ffcf33; box-shadow: 0 0 18px 5px #ff9d00;
           animation: flicker .18s infinite alternate; }
  .cake.blown .flame { opacity: 0; transform: translateX(-50%) scale(.2); transition: .5s; }
  @keyframes flicker { to { transform: translateX(-50%) scale(.88) rotate(4deg); } }
  .blow-button { margin-top: 8px; }

  /* Grand finale */
  .surprise { background: #ffffff22; border-radius: 30px; border: 1px solid #ffffff55; backdrop-filter: blur(10px); }
  .finale { position: fixed; inset: 0; z-index: 80; display: grid; place-items: center; padding: 20px;
            background: linear-gradient(135deg, #6a4c93fa, #e94f77f5); opacity: 0; visibility: hidden;
            transition: opacity .7s, visibility .7s; }
  .finale.active { opacity: 1; visibility: visible; }
  .finale-card { max-width: 650px; color: #fff; text-align: center; }
  .finale-card h2 { font-size: clamp(2.2rem, 8vw, 5rem); }
  .finale-card p { margin: 18px auto 28px; font-size: clamp(1.1rem, 4vw, 1.45rem); line-height: 1.6; }
  .finale-card button { background: #fff; color: var(--accent); }

  @media (prefers-reduced-motion: reduce) {
    html { scroll-behavior: auto; }
    *, *:before, *:after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; }
  }
  @media (max-width: 600px) {
    section { padding: 52px 16px; }
    .hero-photo { width: 150px; height: 150px; }
    .cake { transform: scale(.86); margin-left: calc(50% - 130px); }
  }
</style>
</head>
<body class="opening">
<canvas id="confetti"></canvas>

<div class="envelope-screen" id="envelopeScreen" role="dialog" aria-label="Open your birthday surprise">
  <div class="envelope-wrap">
    <p class="open-envelope-text">A little surprise for you</p>
    <div class="envelope" id="envelope" tabindex="0" role="button" aria-label="Open envelope">
      <div class="flap"></div>
      <div class="letter-preview">Birthday Wishes</div>
    </div>
  </div>
</div>

<!-- ===== EDIT ONLY THIS BLOCK ===== -->

    { text: "Things we should change:\n Apo apo unna theriyama hurt paniduren romba sorry adhunalla romba guilt aiduren, i'll try to change it.  Aprm msg panna late reply pandra laa verupavum.Mukkiyama enn not ah mute la podadha vendakaa. En kuda time spend panla na enaku edho miss pandra mari irukum(unna dha solren). Apo apo time kedaikura apo la enaku call pannu unkuda pesanum nu aasaiya irukum adikadi but pesa dha mudila. Odamba paathukoo loosu olunga saapdu v2la sanda podadha.", by: "Kevin"},

<!-- ===== END OF EDIT BLOCK ===== -->

<section id="hero">
  <img id="heroPhoto" class="hero-photo" alt="">
  <h1 id="title"></h1>
  <p class="sub" id="subtitle"></p>
  <button id="partyBtn">Celebrate</button>
</section>

<section><h2>A message for you</h2><div class="message" id="message"></div></section>
<section><h2>Our memories</h2><div class="gallery" id="gallery"></div></section>
<section><h2>Birthday wishes</h2><div class="wishes" id="wishes"></div></section>

<section class="cake-section">
  <h2>Make a birthday wish</h2>
  <div class="cake" id="cake" aria-label="Virtual birthday cake">
    <div class="candles" aria-hidden="true">
      <div class="candle"><div class="flame"></div></div>
      <div class="candle"><div class="flame"></div></div>
      <div class="candle"><div class="flame"></div></div>
      <div class="candle"><div class="flame"></div></div>
      <div class="candle"><div class="flame"></div></div>
    </div>
    <div class="cake-top"></div>
    <div class="cake-body"></div>
  </div>
  <button class="blow-button" id="blowCandles">Blow the candles</button>
</section>

<section class="surprise">
  <button id="surpriseBtn"></button>
  <div class="message" id="surprise" style="margin-top:24px"></div>
</section>

<footer id="footer"></footer>

<div class="finale" id="finale" role="dialog" aria-modal="true" aria-label="Grand finale celebration">
  <div class="finale-card">
    <h2 id="finaleTitle"></h2>
    <p id="finaleText"></p>
    <button id="closeFinale">Celebrate once more</button>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
const C = CONFIG;

// Apply colors and text
const root = document.documentElement.style;
root.setProperty("--bg1", C.colors.bg1);
root.setProperty("--bg2", C.colors.bg2);
root.setProperty("--accent", C.colors.accent);
document.title = C.headline + " " + C.name + "!";
$("title").textContent = C.headline + " " + C.name + "!";
$("subtitle").textContent = C.subtitle;
$("heroPhoto").src = C.heroPhoto;
$("heroPhoto").onerror = function () { this.style.display = "none"; };
$("message").textContent = C.message;
$("surpriseBtn").textContent = C.surpriseButton;
$("surprise").textContent = C.surpriseText;
$("footer").textContent = "Made with love by " + C.from;

// Gallery
C.photos.forEach(p => {
  const fig = document.createElement("figure");
  const img = document.createElement("img");
  img.src = p.src; img.alt = p.caption;
  const cap = document.createElement("figcaption");
  cap.textContent = p.caption;
  fig.append(img, cap);
  $("gallery").append(fig);
});

// Wishes
C.wishes.forEach(w => {
  const d = document.createElement("div");
  d.className = "wish";
  const p = document.createElement("p");
  p.textContent = w.text;
  const b = document.createElement("b");
  b.textContent = "- " + w.by;
  d.append(p, b);
  $("wishes").append(d);
});

// Confetti
const cv = $("confetti"), ctx = cv.getContext("2d");
let pieces = [];
function resize() { cv.width = innerWidth; cv.height = innerHeight; }
addEventListener("resize", resize); resize();

function burst(n = 150) {
  const colors = ["#ff595e", "#ffca3a", "#8ac926", "#1982c4", "#6a4c93", "#fff"];
  for (let i = 0; i < n; i++) {
    pieces.push({
      x: Math.random() * cv.width, y: -20 - Math.random() * cv.height * 0.5,
      s: 6 + Math.random() * 8, vy: 2 + Math.random() * 4, vx: -2 + Math.random() * 4,
      r: Math.random() * 6, vr: -0.2 + Math.random() * 0.4,
      c: colors[Math.floor(Math.random() * colors.length)]
    });
  }
}
function tick() {
  ctx.clearRect(0, 0, cv.width, cv.height);
  pieces.forEach(p => {
    p.x += p.vx; p.y += p.vy; p.r += p.vr;
    ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r);
    ctx.fillStyle = p.c; ctx.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2); ctx.restore();
  });
  pieces = pieces.filter(p => p.y < cv.height + 30);
  requestAnimationFrame(tick);
}
tick(); burst();

$("partyBtn").onclick = () => burst(250);

// Opening envelope
const envelope = $("envelope");
function openEnvelope() {
  if (envelope.classList.contains("open")) return;
  envelope.classList.add("open");
  burst(180);
  setTimeout(() => {
    $("envelopeScreen").classList.add("opened");
    document.body.classList.remove("opening");
  }, 950);
}
envelope.onclick = openEnvelope;
envelope.onkeydown = event => {
  if (event.key === "Enter" || event.key === " ") {
    event.preventDefault();
    openEnvelope();
  }
};

// Virtual birthday cake
$("blowCandles").onclick = () => {
  const cake = $("cake");
  if (!cake.classList.contains("blown")) {
    cake.classList.add("blown");
    $("blowCandles").textContent = "Make another wish";
    burst(220);
  } else {
    cake.classList.remove("blown");
    $("blowCandles").textContent = "Blow the candles";
  }
};

// Grand finale celebration
$("finaleTitle").textContent = C.headline + " " + C.name + "!";
$("finaleText").textContent = C.surpriseText;
$("surpriseBtn").onclick = () => {
  $("surprise").style.display = "block";
  $("finale").classList.add("active");
  document.body.style.overflow = "hidden";
  burst(500);
};
$("closeFinale").onclick = () => {
  $("finale").classList.remove("active");
  document.body.style.overflow = "";
  burst(350);
};
</script>
</body>
</html>
